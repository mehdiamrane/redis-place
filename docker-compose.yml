services:
  redis:
    image: redis:8.2-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=3001
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PIXEL_COOLDOWN_MS=${PIXEL_COOLDOWN_MS:-1000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_SERVER_URL=${VITE_SERVER_URL}
        - VITE_PIXEL_COOLDOWN_MS=${VITE_PIXEL_COOLDOWN_MS:-1000}
    restart: always
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
